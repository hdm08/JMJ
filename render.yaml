services:
  - type: web
    name: jmj-os
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm run website:start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORE_DRIVER
        value: firestore
      - key: FIRESTORE_PROJECT_ID
        value: jmj-gem
      - key: FIRESTORE_COLLECTION
        value: jmj_os
      - key: FIRESTORE_DOCUMENT
        value: state
      - key: BUSINESS_NAME
        value: Jay Mataji Jewels
      - key: DRIVE_ROOT_FOLDER_NAME
        value: JMJ Digital Catalogue
      - key: MAX_UPLOAD_MB
        value: "250"
      - key: FIREBASE_PROJECT_ID
        value: jmj-gem
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_ALLOWED_EMAILS
        sync: false
      - key: FIRESTORE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
