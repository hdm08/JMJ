services:
  - type: web
    name: jmj-os
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm run website:start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUSINESS_NAME
        value: Jay Mataji Jewels
      - key: DRIVE_ROOT_FOLDER_NAME
        value: JMJ Digital Catalogue
      - key: MAX_UPLOAD_MB
        value: "250"
      - key: FIREBASE_PROJECT_ID
        value: jmj-gem
      - key: FIREBASE_AUTH_DOMAIN
        value: jmj-gem.firebaseapp.com
      - key: FIREBASE_STORAGE_BUCKET
        value: jmj-gem.firebasestorage.app
      - key: FIREBASE_MESSAGING_SENDER_ID
        value: "239292970128"
      - key: FIREBASE_APP_ID
        value: 1:239292970128:web:a39877bbf87b92d0af1415
      - key: FIREBASE_MEASUREMENT_ID
        value: G-E1HS0N0BJY
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_ALLOWED_EMAILS
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
